<style>
  :root{

    --line:#d6dfec;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);padding-bottom:80px;font-size:17px;}
  header{padding:calc(env(safe-area-inset-top) + 18px) 16px 14px;background:var(--card);
    position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);}
  header h1{margin:0;font-size:24px;font-weight:700;line-height:1.3;}
  header p{margin:6px 0 0;font-size:16px;color:var(--muted);}
  nav{display:flex;gap:8px;padding:12px 16px;background:var(--bg);position:sticky;
    top:78px;z-index:9;overflow-x:auto;}
  nav button{flex:1;padding:12px 10px;border:none;border-radius:12px;background:var(--card);
    color:var(--muted);font-size:16px;font-weight:700;white-space:nowrap;}
  nav button.active{background:var(--accent);color:#ffffff;}
  main{padding:12px 16px 24px;}
  section{display:none;}
  section.active{display:block;}
  .day{background:var(--card);border-radius:16px;margin-bottom:12px;overflow:hidden;
    border:1px solid var(--line);}
  .day-head{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .day-head .d{font-size:18px;font-weight:700;line-height:1.35;}
  .day-head .chev{font-size:18px;color:var(--muted);transition:transform .2s;flex-shrink:0;}
  .day.open .chev{transform:rotate(180deg);}
  .day-body{display:none;padding:0 16px 18px;font-size:17px;line-height:1.6;}
  .day.open .day-body{display:block;}
  .item{padding:9px 0;border-top:1px solid var(--line);}
  .item:first-child{border-top:none;}
  .time{color:var(--accent);font-weight:700;margin-right:6px;}
  .flag{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:12px 14px;
    font-size:16px;margin-top:10px;line-height:1.5;}
  .stay{margin-top:12px;padding:14px;background:var(--card2);border-radius:12px;
    font-size:16px;}
  .stay b{display:block;margin-bottom:4px;font-size:17px;}
  .stay .addr{color:var(--muted);}
  .maps-link{display:inline-block;margin-top:8px;color:var(--accent);font-weight:700;
    font-size:16px;text-decoration:none;}
  table{width:100%;border-collapse:collapse;font-size:16px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:700;font-size:15px;}
  .pill{display:inline-block;background:var(--card2);border-radius:20px;padding:5px 12px;
    font-size:14px;color:var(--accent);margin-bottom:8px;font-weight:600;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
  .card h3{margin:0 0 6px;font-size:19px;}
  .card p{margin:2px 0;font-size:16px;color:var(--muted);}
  .card p b{color:var(--text);}
  .top-note{font-size:15px;color:var(--muted);margin-bottom:14px;}
  .search{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);font-size:17px;margin-bottom:12px;}
</style>
</head>

<header>

</nav>

<main>
  <section id="itinerario" class="active">

    </table>
  </section>
</main>

];

function renderDays(filter=""){
  const el = document.getElementById("days");
  el.innerHTML = "";
  DAYS.forEach((day)=>{
    const text = (day.date + " " + day.items.join(" ")).toLowerCase();
    if(filter && !text.includes(filter.toLowerCase())) return;
    const div = document.createElement("div");
    div.className = "day";
    let stayHtml = "";
    if(day.stay){
      const query = day.stay.mapsQuery || (day.stay.name + ", " + day.stay.addr);
      stayHtml = `<div class="stay">
        <b>🏨 ${day.stay.name}</b>
        <div class="addr">${day.stay.addr}</div>
        ${day.stay.note ? `<div class="addr">${day.stay.note}</div>` : ""}
        <a class="maps-link" href="${mapsLink(query)}" target="_blank">📍 Ver en Google Maps</a>
      </div>`;
    }
    div.innerHTML = `
      <div class="day-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="d">${day.date}</div>
        <div class="chev">▾</div>
      </div>
      <div class="day-body">
        ${day.items.map(it=>{
          const m = it.match(/^([0-9~][0-9:\-—~ ]*)( — )(.*)$/);
          if(m) return `<div class="item"><span class="time">${m[1]}</span>${m[3]}</div>`;
          return `<div class="item">${it}</div>`;
        }).join("")}
        ${day.flag ? `<div class="flag">⚠️ ${day.flag}</div>` : ""}
        ${stayHtml}
      </div>`;
    el.appendChild(div);
  });
}

function renderHotels(){
  const el = document.getElementById("hotels");
  el.innerHTML = HOTELS.map(h=>`
    <div class="card">
      <span class="pill">${h.d}</span>
      <h3>${h.n}</h3>
      <p>${h.a}</p>
      <a class="maps-link" href="${mapsLink(h.mapsQuery || (h.n.replace(/^\S+\s/,"") + ", " + h.a))}" target="_blank">📍 Ver en Google Maps</a>
    </div>`).join("");
}

function renderClima(){
  const el = document.getElementById("climaBody");
  el.innerHTML = CLIMA.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td></tr>`).join("");
}

document.querySelectorAll("nav button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll("main section").forEach(s=>s.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("active");
  });
});

document.getElementById("search").addEventListener("input", e=>renderDays(e.target.value));

renderDays();
renderHotels();
renderClima();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
